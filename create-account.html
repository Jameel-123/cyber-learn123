<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Sets the character format -->
  <meta charset="UTF-8" />

  <!-- Makes the page work on phones and tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Name shown in the browser tab -->
  <title>Create Account</title>

  <!-- Connects the page to the CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="login-body">

  <!-- Main container for the create account page -->
  <div class="login-container">

    <!-- Account creation box -->
    <div class="login-card">

      <!-- Page heading -->
      <h1>Create Account</h1>

      <!-- Short instructions for the user -->
      <p class="subtitle">
        Enter your details to create a prototype account.
      </p>

      <!-- Create account form -->
      <form id="createAccountForm">

        <!-- Full name field -->
        <label for="accountName">Full Name</label>
        <input
          type="text"
          id="accountName"
          placeholder="Enter your full name"
          required
        />

        <!-- Age field -->
        <label for="accountAge">Age</label>
        <input
          type="number"
          id="accountAge"
          placeholder="Enter your age"
          required
        />

        <!-- Email field -->
        <label for="accountEmail">Email</label>
        <input
          type="email"
          id="accountEmail"
          placeholder="Enter your email"
          required
        />

        <!-- Username field -->
        <label for="accountUsername">Username</label>
        <input
          type="text"
          id="accountUsername"
          placeholder="Create a username"
          required
        />

        <!-- Password field -->
        <label for="accountPassword">Password</label>
        <input
          type="password"
          id="accountPassword"
          placeholder="Create a password"
          required
        />

        <!-- Confirm password field -->
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Re-enter your password"
          required
        />

        <!-- Creates the account when clicked -->
        <button type="submit">Create Account</button>

      </form>

      <!-- Shows success or error messages -->
      <p id="accountMessage" class="message"></p>

      <!-- Takes the user back to the login page -->
      <a class="card-btn" href="login.html" style="margin-top: 20px;">
        Back to Login
      </a>

    </div>
  </div>

  <!-- Loads the JavaScript file -->
  <script src="script.js"></script>

</body>
</html>
