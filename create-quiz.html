<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Sets the text format -->
  <meta charset="UTF-8" />

  <!-- Makes the page work on phones and tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Name shown in the browser tab -->
  <title>Create Quiz</title>

  <!-- Connects the CSS file -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <script>

    <!-- Checks if the user is logged in -->
    <!-- Sends them back to the login page if they are not -->

    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "login.html";
    }

  </script>

  <!-- Website header section -->
  <header class="site-header">

    <div>

      <!-- Website title -->
      <h1>CYBERLEARN</h1>

      <!-- Page description -->
      <p class="subtitle">
        Create Your Own Quiz
      </p>

    </div>

    <!-- Navigation menu -->
    <nav class="navbar">

      <!-- Navigation links -->
      <a href="index.html">Home</a>
      <a href="download.html">Download Tool</a>
      <a href="tutorial.html">Tutorial</a>
      <a href="quiz.html">Quiz</a>
      <a href="forum.html">Forum</a>

      <!-- Logs the user out -->
      <button class="logout-btn" onclick="logout()">
        Logout
      </button>

    </nav>
  </header>

  <!-- Main page content -->
  <main class="page-container">

    <section class="single-card">

      <!-- Page heading -->
      <h2>Create Your Own Quiz</h2>

      <!-- Instructions for the user -->
      <p>
        Build a custom quiz with between 3 and 15 questions.
      </p>

      <!-- Adds a new question -->
      <button id="addQuestionBtn">
        Add Question
      </button>

      <!-- New questions are placed here by JavaScript -->
      <div id="questionsContainer"></div>

      <!-- Saves the completed quiz -->
      <button id="saveQuizBtn" style="margin-top: 20px;">
        Save Quiz
      </button>

      <!-- Shows success or error messages -->
      <p id="quizSaveMessage" class="result-box"></p>

    </section>
  </main>

  <!-- Loads the JavaScript file -->
  <script src="script.js"></script>

</body>
</html>
